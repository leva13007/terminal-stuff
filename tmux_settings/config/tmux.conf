set -g mouse on

bind h split-window -h
bind v split-window -v

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g base-index 1

set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# Копіювати виділене мишкою одразу в системний clipboard (macOS),
# незалежно від того чи термінал підтримує bypass-модифікатор
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode     MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Швидкий toggle mouse-режиму: prefix + m — вимкнути mouse (нативне
# виділення в терміналі як завжди), ще раз prefix + m — увімкнути назад
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"


# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'    # авто-відновлення при старті


# Ініціалізація — завжди останній рядок!
run '~/.tmux/plugins/tpm/tpm'